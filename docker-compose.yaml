services:
  app:
    build: .
    command: npm run dev
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/FactoryFlow?replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET dans .env}
      NODE_ENV: development
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
  mongodb:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongodb:27017\"}]}); }' | grep -q 1"]
      interval: 5s
      timeout: 10s
      retries: 20
volumes:
  mongodb_data:
  app_node_modules:
